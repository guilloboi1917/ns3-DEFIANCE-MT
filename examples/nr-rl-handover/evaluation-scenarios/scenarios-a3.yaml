# scenarios-a3.yaml — A3 baseline evaluation matrix for defiance-nr-rl-handover
#
# A3 baselines only (no RL). Use for comparison against RL-agent runs.
# Each scenario is run N seeds (0..n_seeds-1) and results are aggregated.
# Handover margin defaults to 3.0 dB.

evaluation:
  name: "nr-rl-handover-a3-baselines"
  n_seeds: 40
  sim_time: 20  # seconds

  common:
    topology: triangle
    intersiteDistance: 500
    uavMobility: random-waypoint
    tcpVariant: TcpBbr
    startHeight: 80
    endHeight: 200

  scenarios:
    # --- No interference ---
    - tag: "a3-ul-no-if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 0
      aerialUeRatio: 0.0

    - tag: "a3-dl-no-if"
      algorithm: a3
      flowDirection: dl
      addInterferingUes: 0
      aerialUeRatio: 0.0

    # --- Aerial interference ---
    - tag: "a3-ul-aerial-if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 4
      aerialUeRatio: 1.0

    - tag: "a3-dl-aerial-if"
      algorithm: a3
      flowDirection: dl
      addInterferingUes: 4
      aerialUeRatio: 1.0

    # --- Ground interference ---
    - tag: "a3-ul-ground-if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 4
      aerialUeRatio: 0.0

    - tag: "a3-dl-ground-if"
      algorithm: a3
      flowDirection: dl
      addInterferingUes: 4
      aerialUeRatio: 0.0

    # --- Mixed interference ---
    - tag: "a3-ul-mixed-if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 4
      aerialUeRatio: 0.5

    - tag: "a3-dl-mixed-if"
      algorithm: a3
      flowDirection: dl
      addInterferingUes: 4
      aerialUeRatio: 0.5
