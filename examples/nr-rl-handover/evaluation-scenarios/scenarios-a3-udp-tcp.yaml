# scenarios-a3.yaml — A3 baseline evaluation matrix for defiance-nr-rl-handover
#
# A3 baselines only (no RL). Use for comparison against RL-agent runs.
# Each scenario is run N seeds (0..n_seeds-1) and results are aggregated.
# Handover margin defaults to 3.0 dB.

evaluation:
  name: "nr-rl-handover-a3-baselines"
  n_seeds: 36
  sim_time: 30  # seconds

  common:
    topology: triangle
    intersiteDistance: 500
    uavMobility: random-waypoint
    tcpVariant: TcpBbr
    startHeight: 50
    endHeight: 150

  scenarios:
    # --- TCP ---
    # --- Aerial interference ---
    - tag: "tcp-ul-aerial-if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 4
      aerialUeRatio: 1.0
      transportProtocol: tcp

    - tag: "tcp-dl-aerial-if"
      algorithm: a3
      flowDirection: dl
      addInterferingUes: 4
      aerialUeRatio: 1.0
      transportProtocol: tcp

      # --- No interference ---
    - tag: "tcp-ul-no-if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 0
      aerialUeRatio: 0.0
      transportProtocol: tcp

    - tag: "tcp-dl-no-if"
      algorithm: a3
      flowDirection: dl
      addInterferingUes: 0
      aerialUeRatio: 0.0
      transportProtocol: tcp

    # --- UDP ---
        # --- No interference ---
    - tag: "udp-ul-no-if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 0
      aerialUeRatio: 0.0
      transportProtocol: udp

    - tag: "udp-dl-no-if"
      algorithm: a3
      flowDirection: dl
      addInterferingUes: 0
      aerialUeRatio: 0.0
      transportProtocol: udp

    # --- Aerial interference ---
    - tag: "udp-ul-aerial-if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 4
      aerialUeRatio: 1.0
      transportProtocol: udp

    - tag: "udp-dl-aerial-if"
      algorithm: a3
      flowDirection: dl
      addInterferingUes: 4
      aerialUeRatio: 1.0
      transportProtocol: udp


    
