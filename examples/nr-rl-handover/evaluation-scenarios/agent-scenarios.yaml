# evaluate-agent.py scenario matrix — trained RL agent policy evaluation.
#
# Mirrors the A3 baseline matrix (run-evaluation.py / scenarios.yaml) but with
# handoverAlgorithm=agent driven by `run-agent infer` using best_checkpoint.
# Each (scenario, seed) runs one full episode; results land in
# results/<name>/<tag>/{raw,aggregate}.csv
#
# Usage:
#   cd /path/to/ns-3-dev
#   python3 contrib/defiance/examples/nr-rl-handover/evaluate-agent.py \
#       contrib/defiance/examples/nr-rl-handover/evaluation-scenarios/agent-scenarios.yaml -j 4
#
# Reward/obs-affecting settings (rlRewardComposition, rlBetaHandover,
# stepTime, useTbsObservation, ...) are INHERITED from the checkpoint run's
# meta.yaml when they are not listed here — so the eval reward matches
# training even while the scenarios vary topology/interference/heights.
# Explicit `common:` values override the inherited ones.
#
# A run-agent meta.yaml / run directory also works directly — evaluates the
# policy in its exact training environment:
#   python3 .../evaluate-agent.py ~/ray_results/<exp>/ -j 4

evaluation:
  name: agent-eval-ppo
  # Experiment dir (auto-appends best_checkpoint) or direct checkpoint dir.
  # NOTE (2026-08-05): the obs layout changed (29-dim grouped + time-delta
  # block + 3D heading). All pre-2026-08-05 checkpoints (incl. the one below)
  # are incompatible with the new obs app — update this to a post-retrain
  # alpha=0.8 checkpoint before evaluating.
  checkpoint: /home/nisaak/ray_results/SAC_2026-08-04_20-56-01/
  n_seeds: 7
  sim_time: 70
  common:
    transportProtocol: udp
    flowDirection: dl
    uavMobility: random-waypoint
    startHeight: 50
    endHeight: 150
  scenarios:
    - tag: triangle-no-if
      topology: triangle
      addInterferingUes: 0
      aerialUeRatio: 0.0

    # - tag: triangle-4if
    #   topology: triangle
    #   addInterferingUes: 4
    #   aerialUeRatio: 1.0

    # - tag: hexgrid-no-if
    #   topology: hexgrid
    #   addInterferingUes: 0
    #   aerialUeRatio: 0.0

    # - tag: hexgrid-4if
