# Transfer eval (2026-09-02): the no-if TCP policy (beta 1.0,
# PPO_2026-09-02_00-07-41) evaluated on the if scenario (4 aerial
# interferers) — the run behind the transfer-win result (KB §8). OnOff
# over TCP (RLC AM): the congestion controller dips after lossy
# handovers (cwnd/RTO). Traffic rate 35 Mbps is the TCP cap (offered load),
# below the measured v5.1 UL ceiling (~40 Mbps @ 30 MHz n1).
#
# Run:
#   python3 contrib/defiance/examples/nr-rl-handover/run-evaluations.py \
#       contrib/defiance/examples/nr-rl-handover/evaluation-scenarios/rl/agent-eval-ul-if-tcp.yaml \
#       --jobs 4 --analyze
#
# Reward/obs-affecting settings are INHERITED from the checkpoint run's
# meta.yaml when not listed here; explicit `common:` values override.

evaluation:
  name: agent-eval-ul-if-tcp
  mode: rl
  checkpoint: /home/nisaak/ray_results/PPO_2026-09-02_20-53-50  # if TCP (beta 1.0); auto-appends best_checkpoint
  n_seeds: 20
  sim_time: 50                 # must match the training simDuration
  common:
    transportProtocol: tcp
    flowDirection: ul           # 3GPP UAV primary direction (UL)
    uavMobility: random-waypoint
    startHeight: 50
    endHeight: 200
    topology: triangle
    addInterferingUes: 4
    aerialUeRatio: 1.0
    interfererMobility: static  # "waypoint" = legacy random flight
    bandwidthMhz: 30
    numerology: 1
    errorModel: eesm-ir-t1
    channelUpdateMs: 20         # channel spatial-consistency update period (ms)
    trafficRateMbps: 35         # TCP cap == UDP offered load (same headroom)
    rlRewardRefMbps: 35         # must match the training config
  scenarios:
    - tag: triangle-ul-if-tcp
      topology: triangle
      addInterferingUes: 4
      aerialUeRatio: 1.0
