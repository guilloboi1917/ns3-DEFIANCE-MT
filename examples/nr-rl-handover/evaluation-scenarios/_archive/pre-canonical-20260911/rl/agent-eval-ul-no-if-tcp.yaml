# Trained RL agent evaluation under a TCP transport (robustness pass).
# Same checkpoint and radio settings as agent-eval-ul-no-if, but the flow
# is OnOff over TCP (RLC AM): the congestion controller dips after lossy
# handovers (cwnd/RTO), so the RL-vs-A3 comparison is tested under a
# transport that amplifies handover transients instead of passing them
# through like CBR UDP. Traffic rate 35 Mbps is the TCP cap (offered load),
# below the measured v5.1 UL ceiling (~40 Mbps @ 30 MHz n1) — the question
# is whether TCP sustains its target through the handover dips.
#
# Run:
#   python3 contrib/defiance/examples/nr-rl-handover/run-evaluations.py \
#       contrib/defiance/examples/nr-rl-handover/evaluation-scenarios/rl/agent-eval-ul-no-if-tcp.yaml \
#       --jobs 4 --analyze
#
# Reward/obs-affecting settings are INHERITED from the checkpoint run's
# meta.yaml when not listed here; explicit `common:` values override.

evaluation:
  name: agent-eval-ul-no-if-tcp
  mode: rl
  checkpoint: /home/nisaak/ray_results/PPO_2026-09-02_00-07-41/  # no-if TCP, beta 1.0, 120 iters; auto-appends best_checkpoint
  n_seeds: 20
  sim_time: 50                 # must match the training simDuration
  common:
    transportProtocol: tcp
    flowDirection: ul           # 3GPP UAV primary direction (UL)
    uavMobility: random-waypoint
    startHeight: 50
    endHeight: 200
    topology: triangle
    addInterferingUes: 0
    aerialUeRatio: 0.0
    interfererMobility: static  # "waypoint" = legacy random flight
    bandwidthMhz: 30
    numerology: 1
    errorModel: eesm-ir-t1
    channelUpdateMs: 20         # channel spatial-consistency update period (ms)
    trafficRateMbps: 35         # TCP cap == UDP offered load (same headroom)
    rlRewardRefMbps: 35         # must match the training config
  scenarios:
    - tag: triangle-ul-no-if-tcp
      topology: triangle
      addInterferingUes: 0
      aerialUeRatio: 0.0
