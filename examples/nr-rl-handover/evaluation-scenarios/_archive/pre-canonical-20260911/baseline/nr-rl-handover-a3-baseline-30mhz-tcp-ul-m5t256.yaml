# nr-rl-handover-a3-baseline-30mhz-tcp-ul-m5t256.yaml — A3 baseline (TCP,
# UL) at the SWEEP-TUNED parameters (margin 5 dB, TTT 256 ms — the a3-sweep
# winner, KB 13). Controlled comparison cell for the TCP agent evals: same
# cell and offered load as the RL runs, 20 seeds, pinned RNG streams for
# per-seed pairing: 30 MHz n1, triangle, ISD 500 m, random-waypoint
# 50-200 m @ 20 m/s, UMa-AV 20 ms, eesm-ir-t1, TCP UL, cap 35 Mbps
# (below the v5.1 [50-200] m ceiling 39.5 Mbps), 50 s.
#
# The default-3 dB/256 ms A3 legs live in
# nr-rl-handover-a3-baseline-30mhz-tcp-ul.yaml (recorded in KB 8 / plan 2b);
# this tuned pair is the comparison baseline of record for B3.
#
# Run:
#   python3 contrib/defiance/examples/nr-rl-handover/run-evaluations.py \
#       contrib/defiance/examples/nr-rl-handover/evaluation-scenarios/baseline/nr-rl-handover-a3-baseline-30mhz-tcp-ul-m5t256.yaml \
#       --jobs 5 --analyze

evaluation:
  name: "nr-rl-handover-a3-baseline-30mhz-tcp-ul-m5t256"
  mode: a3
  n_seeds: 20
  sim_time: 50

  common:
    topology: triangle
    intersiteDistance: 500
    uavMobility: random-waypoint
    ueSpeed: 20
    startHeight: 50
    endHeight: 200
    bandwidthMhz: 30
    numerology: 1
    errorModel: eesm-ir-t1
    channelUpdateMs: 20
    trafficRateMbps: 35         # TCP cap (offered load); below the 39.5 Mbps ceiling
    rlRewardRefMbps: 35         # informational (A3 runs no RL apps); matches the agent evals
    a3HysteresisDb: 5           # sweep-tuned A3 (KB 13): was the 3 dB default
    a3TttMs: 256                # sweep-tuned A3 (KB 13): unchanged default TTT

  scenarios:
    - tag: "tcp-ul-no-if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 0
      aerialUeRatio: 0.0
      transportProtocol: tcp

    - tag: "tcp-ul-if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 4
      aerialUeRatio: 1.0
      transportProtocol: tcp
