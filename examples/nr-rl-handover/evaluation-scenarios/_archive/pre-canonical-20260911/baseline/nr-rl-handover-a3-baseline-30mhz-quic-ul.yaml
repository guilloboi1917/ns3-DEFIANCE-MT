# nr-rl-handover-a3-baseline-30mhz-quic-ul.yaml — A3 baseline (QUIC BBR, UL),
# no interference variant. Transport-comparison cell against the TCP config
# (nr-rl-handover-a3-baseline-30mhz-tcp-ul.yaml) on identical geometry and
# load: 30 MHz n1, triangle, ISD 500 m, random-waypoint 50-200 m @ 20 m/s,
# UMa-AV 20 ms, eesm-ir-t1, QUIC UL (single stream, BBR, RLC AM), near-capacity
# 35 Mbps (above the ~33 Mbps ceiling), 50 s, 20 seeds.
#
# 2026-09-08 — RUNNABLE. The ~1.8 s freeze previously recorded here was the
# UE RLC TX buffer cap being overrun by the QUIC startup burst (BUGS-ISSUES
# #31 correction / #34), not an unconditional module failure: at 180 kB the
# flow delivers 1.0 MB then wedges (690 NrRlc::TxDrop events from 1.59 s),
# while at 512 kB the ENTEL-WNG fork sustains 202.1 MB / 32.34 Mbps over a
# full 50 s episode (seed 0, handovers included). The scenario now warns only
# if --rlcTxBufferBytes < 524288, so the cap below is mandatory.
#
# Run:
#   python3 contrib/defiance/examples/nr-rl-handover/run-evaluations.py \
#       contrib/defiance/examples/nr-rl-handover/evaluation-scenarios/baseline/nr-rl-handover-a3-baseline-30mhz-quic-ul.yaml \
#       --jobs 5 --analyze
#
# Notes: retransmissions.csv counts QUIC loss-triggered retransmission events
# (DoRetransmit; TLP probes excluded); pacing/cwnd-gain CSVs come from the
# QuicBbr traces added in contrib/quic.

evaluation:
  name: "nr-rl-handover-a3-baseline-30mhz-quic-ul"
  mode: a3
  n_seeds: 20
  sim_time: 50

  common:
    topology: triangle
    intersiteDistance: 500
    uavMobility: random-waypoint
    ueSpeed: 20
    startHeight: 50
    endHeight: 200
    bandwidthMhz: 30
    numerology: 1
    errorModel: eesm-ir-t1
    channelUpdateMs: 20
    trafficRateMbps: 35         # near-capacity load (measured 30 MHz n1 UL ceiling ~33 Mbps)
    rlcTxBufferBytes: 1048576    # MANDATORY for QUIC: must be >= the 1 MiB QUIC
                                 # socket/stream buffers, otherwise the startup
                                 # burst overruns the UE RLC TX buffer and the
                                 # flow wedges ~1.8 s in (#31 correction / #34).
                                 # 1 MiB = the TCP SndBuf value used everywhere else
    rlRewardRefMbps: 35       # informational (A3 runs no RL apps); matches the agent evals

  scenarios:
    - tag: "quic-ul-no-if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 0
      aerialUeRatio: 0.0
      transportProtocol: quic

    - tag: "quic-ul-if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 4
      aerialUeRatio: 1.0
      transportProtocol: quic
