# nr-rl-handover-a3-baseline-10mhz-udp-dl.yaml — A3 baseline (UDP, DL), both
# interference variants. OUT OF SCOPE for the measured campaign (UL-only per
# regime-scope); kept as a reference for the dl-if future-work paragraph.
# Same canonical config and pinned RNG streams as the UL file: 30 MHz n1,
# triangle, ISD 500 m, random-waypoint 50-200 m @ 20 m/s, UMa-AV 20 ms,
# eesm-ir-t1, UDP DL, near-capacity 35 Mbps (just above the measured
# ~33 Mbps UL ceiling), 50 s.
#
# Run:
#   python3 contrib/defiance/examples/nr-rl-handover/run-evaluations.py \
#       contrib/defiance/examples/nr-rl-handover/evaluation-scenarios/baseline/nr-rl-handover-a3-baseline-30mhz-udp-dl.yaml \
#       --jobs 4 --analyze

evaluation:
  name: "nr-rl-handover-a3-baseline-30mhz-udp-dl"
  mode: a3
  n_seeds: 20
  sim_time: 50

  common:
    topology: triangle
    intersiteDistance: 500
    uavMobility: random-waypoint
    ueSpeed: 20
    startHeight: 50
    endHeight: 200
    bandwidthMhz: 30
    numerology: 1
    errorModel: eesm-ir-t1
    channelUpdateMs: 20
    trafficRateMbps: 35         # near-capacity load (measured 30 MHz n1 UL ceiling ~33 Mbps)
    rlRewardRefMbps: 35       # informational (A3 runs no RL apps); matches the agent evals

  scenarios:
    - tag: "udp-dl-no-if"
      algorithm: a3
      flowDirection: dl
      addInterferingUes: 0
      aerialUeRatio: 0.0
      transportProtocol: udp

    - tag: "udp-dl-if"
      algorithm: a3
      flowDirection: dl
      addInterferingUes: 4
      aerialUeRatio: 1.0
      transportProtocol: udp
