# agent-eval-ul-if-tcp-canonical.yaml -- CANONICAL REGIME COPY of agent-eval-ul-if-tcp.yaml.
# Zero-shot re-evaluation of the frozen checkpoints in the canonical regime.
# Canonical transport regime adopted 2026-09-08 (arm G of
# baseline/delack-race.yaml; see KB buffer-timer-regime.md 8c):
#   tcpSndBufBytes 1 MiB / rlcTxBufferBytes 2 MiB / tcpMinRtoMs 200 /
#   tcpDelAckTimeoutMs 40 / tcpDelAckCount 2.
# Measured effect vs the frozen regime (NewReno, 30 MHz n1): trapped
# seeds 5/10 -> 0/10, silent RLC discards 401 -> 0 per seed, median
# delivery 21.3 -> 49.6 MB, median RTT 54 -> 66 ms.
# NOTE this is a different environment from the one the RL checkpoints
# were trained in: use it for zero-shot transfer evaluation first.
# Transfer eval (2026-09-02): the no-if TCP policy (beta 1.0,
# PPO_2026-09-02_00-07-41) evaluated on the if scenario (4 aerial
# interferers) — the run behind the transfer-win result (KB §8). OnOff
# over TCP (RLC AM): the congestion controller dips after lossy
# handovers (cwnd/RTO). Traffic rate 35 Mbps is the TCP cap (offered load),
# below the measured v5.1 UL ceiling (~40 Mbps @ 30 MHz n1).
#
# Run:
#   python3 contrib/defiance/examples/nr-rl-handover/run-evaluations.py \
#       contrib/defiance/examples/nr-rl-handover/evaluation-scenarios/rl/agent-eval-ul-if-tcp.yaml \
#       --jobs 4 --analyze
#
# Reward/obs-affecting settings are INHERITED from the checkpoint run's
# meta.yaml when not listed here; explicit `common:` values override.

evaluation:
  name: agent-eval-ul-if-tcp-canonical
  mode: rl
  checkpoint: /home/nisaak/ray_results/PPO_2026-09-02_20-53-50  # if TCP (beta 1.0); auto-appends best_checkpoint
  n_seeds: 20
  sim_time: 50                 # must match the training simDuration
  common:
    tcpSndBufBytes: 1048576  # >= 2x BDP at the 50 MHz cell (canonical, G)
    rlcTxBufferBytes: 2097152  # >= SndBuf + one BDP -> 0 NrRlc::TxDrop (canonical, G)
    tcpMinRtoMs: 200  # Linux TCP_RTO_MIN (canonical, G)
    tcpDelAckTimeoutMs: 40  # Linux TCP_DELACK_MIN; breaks the delayed-ACK/RTO race (canonical, G)
    tcpDelAckCount: 2  # keep 2: does not inflate DL ACK volume (beam artifact #32)
    transportProtocol: tcp
    flowDirection: ul           # 3GPP UAV primary direction (UL)
    uavMobility: random-waypoint
    startHeight: 50
    endHeight: 200
    topology: triangle
    addInterferingUes: 4
    aerialUeRatio: 1.0
    interfererMobility: static  # "waypoint" = legacy random flight
    bandwidthMhz: 30
    numerology: 1
    errorModel: eesm-ir-t1
    channelUpdateMs: 20         # channel spatial-consistency update period (ms)
    trafficRateMbps: 35         # TCP cap == UDP offered load (same headroom)
    rlRewardRefMbps: 35         # must match the training config
  scenarios:
    - tag: triangle-ul-if-tcp
      topology: triangle
      addInterferingUes: 4
      aerialUeRatio: 1.0
