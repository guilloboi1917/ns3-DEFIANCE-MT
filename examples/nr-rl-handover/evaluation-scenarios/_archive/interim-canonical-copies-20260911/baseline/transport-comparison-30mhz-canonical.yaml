# REGIME: canonical (adopted 2026-09-11; RLC TX 2 MiB, TCP SndBuf 1 MiB,
# MinRto 200 ms, DelAck 40 ms x2). Pre-canonical versions of this and the
# rest of the campaign live in evaluation-scenarios/_archive/.
# transport-comparison-30mhz-canonical.yaml -- the 30 MHz slice of
# transport-comparison-canonical.yaml (canonical regime, UDP vs TCP-BBR vs
# QUIC-BBR, offered 43 Mbps = 1.12x the measured 38.23 Mbps ceiling).
# The 50 MHz cells are intentionally omitted (not needed for the 30 MHz
# canonical focus).
#
# MEASURED 2026-09-11 with the 2 MiB cap: UDP holds a standing queue (1-way
# delay p50 265 ms vs 56 ms at the old 180 kB cap) at unchanged goodput
# (35.55 vs 35.58 Mbps) and lower e2e loss (15.5 % vs 19.2 %) - the cap is a
# queue for UDP and a truncation guard for the reliable transports, so a UDP
# cap-sensitivity cell (180 kB) belongs next to this table.
#
# The QUIC cell requires the app-model fix first: the
# saturating BulkSend sender stops early and then hangs the simulator
# (see BUGS-ISSUES / results/_archive/transport-canonical-quic-hung-20260911).
#
# Run (UDP/TCP only are safe today):
#   python3 .../run-evaluations.py .../baseline/transport-comparison-30mhz-canonical.yaml --jobs 5 --analyze
# or reuse the completed cells in results/transport-comparison-canonical/.
evaluation:
  name: transport-comparison-30mhz-canonical
  mode: a3
  n_seeds: 20
  sim_time: 50
  common:
    flowDirection: ul
    startHeight: 50
    endHeight: 200
    ueSpeed: 20
    addInterferingUes: 0
    aerialUeRatio: 0
    topology: triangle
    uavMobility: random-waypoint
    tcpVariant: TcpBbr
    tcpSndBufBytes: 1048576
    rlcTxBufferBytes: 2097152
    tcpMinRtoMs: 200
    tcpDelAckTimeoutMs: 40
    tcpDelAckCount: 2
  scenarios:
    - {tag: bw30-n1_udp,  transportProtocol: udp,  bandwidthMhz: 30, numerology: 1, trafficRateMbps: 43}
    - {tag: bw30-n1_tcp,  transportProtocol: tcp,  bandwidthMhz: 30, numerology: 1, trafficRateMbps: 43}
    - {tag: bw30-n1_quic, transportProtocol: quic, bandwidthMhz: 30, numerology: 1, trafficRateMbps: 43}
