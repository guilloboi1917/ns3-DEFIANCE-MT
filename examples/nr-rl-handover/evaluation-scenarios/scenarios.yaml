# scenarios.yaml — Evaluation scenario matrix for defiance-nr-rl-handover
#
# Each scenario is run N seeds (0..n_seeds-1) and results are aggregated.
# Use "algorithm: agent" for RL-agent runs, "algorithm: a3" for A3 baselines.
# RL runs automatically set rlMode=true and stepTime=480.
# A3 runs automatically set rlMode=false and use --handoverMargin=3.

evaluation:
  name: "nr-rl-handover-eval"
  n_seeds: 20
  sim_time: 30  # seconds

  common:
    topology: triangle
    intersiteDistance: 500
    uavMobility: random-waypoint
    tcpVariant: TcpBbr
    flowDirection: ul
    startHeight: 80
    endHeight: 200

  scenarios:
    # --- RL agent: no interference ---
    - tag: "rl-ul-no-if"
      algorithm: agent
      flowDirection: ul
      addInterferingUes: 0
      aerialUeRatio: 0.0

    - tag: "rl-dl-no-if"
      algorithm: agent
      flowDirection: dl
      addInterferingUes: 0
      aerialUeRatio: 0.0

    # --- RL agent: aerial interference ---
    - tag: "rl-ul-aerial-if"
      algorithm: agent
      flowDirection: ul
      addInterferingUes: 4
      aerialUeRatio: 1.0

    - tag: "rl-dl-aerial-if"
      algorithm: agent
      flowDirection: dl
      addInterferingUes: 4
      aerialUeRatio: 1.0

    # --- RL agent: ground interference ---
    - tag: "rl-ul-ground-if"
      algorithm: agent
      flowDirection: ul
      addInterferingUes: 4
      aerialUeRatio: 0.0

    - tag: "rl-ul-mixed-if"
      algorithm: agent
      flowDirection: ul
      addInterferingUes: 4
      aerialUeRatio: 0.5

    # --- A3 baselines (same seeds, same topology) ---
    - tag: "a3-ul-no-if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 0
      aerialUeRatio: 0.0

    - tag: "a3-dl-no-if"
      algorithm: a3
      flowDirection: dl
      addInterferingUes: 0
      aerialUeRatio: 0.0

    - tag: "a3-ul-aerial-if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 4
      aerialUeRatio: 1.0

    - tag: "a3-dl-aerial-if"
      algorithm: a3
      flowDirection: dl
      addInterferingUes: 4
      aerialUeRatio: 1.0

    - tag: "a3-ul-ground-if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 4
      aerialUeRatio: 0.0

    - tag: "a3-ul-mixed-if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 4
      aerialUeRatio: 0.5
