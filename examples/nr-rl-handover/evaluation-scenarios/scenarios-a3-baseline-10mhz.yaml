# scenarios-a3-baseline-10mhz.yaml — A3 baseline evaluation matrix (canonical 10 MHz campaign)
#
# NOTE (2026-08-13): the first run of this matrix used RLC UM for ALL transports
# (deliberate alignment so the TCP-vs-UDP comparison isolates the transport).
# The scenario now uses RLC AM for TCP (realistic; UM stays for UDP) — re-run the
# four tcp-* scenarios under the current binary for the realistic TCP numbers;
# the first run's tcp-* values remain valid as the aligned-UM comparison. See
# RL-AUDIT §9 (RLC mode for TCP). UDP columns are unchanged.
#
# Established 2026-08-13 after the canonical-config decision (§4.6 of the thesis
# structure review): 10 MHz / 52 PRBs, OFDMA scheduler,
# pinned RNG streams. Every dimension of the 2x2x2 matrix (transport x direction
# x interference) shares this exact config so the baselines are internally
# comparable and, under the matched-trajectory methodology (SetStream 100-102 +
# 110-112, runId=1), directly comparable to the RL-agent evals per seed.
#
# 8 scenarios x 10 seeds. Run:
#   python3 contrib/defiance/examples/nr-rl-handover/run-evaluation.py \
#       contrib/defiance/examples/nr-rl-handover/evaluation-scenarios/scenarios-a3-baseline-10mhz.yaml -j 4
#
# Walltime budget at 10 MHz (see RL-AUDIT §9): no-if ~1.3 s/sim-second,
# 4-if ~2.5 s/sim-second -> 50 s episode ~65 s / ~125 s per seed.
# Sequential ~2 h; with -j 4 ~35 min.

evaluation:
  name: "nr-rl-handover-a3-baseline-10mhz"
  n_seeds: 10
  sim_time: 50  # seconds (user-chosen tradeoff; waypoint plan identical to 70 s up to 50 s)

  common:
    topology: triangle
    intersiteDistance: 500
    uavMobility: random-waypoint
    tcpVariant: TcpBbr
    startHeight: 50
    endHeight: 200
    bandwidthMhz: 10          # canonical campaign config
    errorModel: eesm-ir-t1    # canonical campaign config
    channelUpdateMs: 50       # canonical campaign config (50 ms x 20 m/s = 1 m step)
    rlRewardRefMbps: 20       # informational only: A3 baseline has no RL apps (rlMode=false), the ref is inert (2026-08-13)
    handoverMargin: 3.0

  scenarios:
    # --- UDP ---
    - tag: "udp-dl-no-if"
      algorithm: a3
      flowDirection: dl
      addInterferingUes: 0
      aerialUeRatio: 0.0
      transportProtocol: udp

    - tag: "udp-dl-4if"
      algorithm: a3
      flowDirection: dl
      addInterferingUes: 4
      aerialUeRatio: 1.0
      transportProtocol: udp

    - tag: "udp-ul-no-if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 0
      aerialUeRatio: 0.0
      transportProtocol: udp

    - tag: "udp-ul-4if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 4
      aerialUeRatio: 1.0
      transportProtocol: udp

    # --- TCP (TcpBbr) ---
    - tag: "tcp-dl-no-if"
      algorithm: a3
      flowDirection: dl
      addInterferingUes: 0
      aerialUeRatio: 0.0
      transportProtocol: tcp

    - tag: "tcp-dl-4if"
      algorithm: a3
      flowDirection: dl
      addInterferingUes: 4
      aerialUeRatio: 1.0
      transportProtocol: tcp

    - tag: "tcp-ul-no-if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 0
      aerialUeRatio: 0.0
      transportProtocol: tcp

    - tag: "tcp-ul-4if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 4
      aerialUeRatio: 1.0
      transportProtocol: tcp
