# REGIME: canonical (adopted 2026-09-11; RLC TX 2 MiB, TCP SndBuf 1 MiB,
# MinRto 200 ms, DelAck 40 ms x2). Pre-canonical versions of this and the
# rest of the campaign live in evaluation-scenarios/_archive/.
# a3-sweep.yaml — A3 parameter sweep at the canonical cell (margin x TTT).
# Purpose: choose/justify the tuned A3 baseline used in the RL-vs-A3
# comparisons (baseline hygiene: A3 must not be naive). Margin {0,3,5} dB x
# TTT {128,256,512} ms; the 0 dB row is the churn-contrast reference. The
# "A3 collapse into a churn policy" expectation becomes
# measured data. m3-t256 == the default used by every baseline so far
# (sanity cell).
#
# 5 seeds (vs 20 elsewhere): the sweep cells are paired on identical
# per-seed trajectories/channels, so the A3 outcome is a deterministic
# function of the RSRP trace — consistent per-config differences read from
# few seeds. Driven by the 2026-09-02 CLI knobs --a3HysteresisDb /
# --a3TttMs (were hardcoded 3.0 dB / 256 ms in scenario-setup.cc).
#
# Cell: 30 MHz n1, NO aerial interferers, [50-200] m @ 20 m/s, TCP cap
# 35 Mbps (the core-comparison regime), RLC AM, 50 s, A3.
#
# Run:
#   python3 .../run-evaluations.py .../evaluation-scenarios/baseline/a3-sweep.yaml \
#       --jobs 4 --analyze

evaluation:
  name: a3-sweep
  mode: a3
  n_seeds: 5
  sim_time: 50
  common:
    tcpSndBufBytes: 1048576  # canonical: SndBuf >= 2x BDP
    rlcTxBufferBytes: 2097152  # canonical: RLC TX cap >= SndBuf + one BDP
    tcpMinRtoMs: 200  # canonical: Linux TCP_RTO_MIN
    tcpDelAckTimeoutMs: 40  # canonical: Linux TCP_DELACK_MIN (breaks the delayed-ACK/RTO race)
    tcpDelAckCount: 2
    flowDirection: ul
    transportProtocol: tcp
    uavMobility: random-waypoint
    startHeight: 50
    endHeight: 200
    ueSpeed: 20
    addInterferingUes: 0
    aerialUeRatio: 0
    topology: triangle
    bandwidthMhz: 30
    numerology: 1
    trafficRateMbps: 35
  scenarios:
    - {tag: m0-t128,  a3HysteresisDb: 0, a3TttMs: 128}
    - {tag: m0-t256,  a3HysteresisDb: 0, a3TttMs: 256}
    - {tag: m0-t512,  a3HysteresisDb: 0, a3TttMs: 512}
    - {tag: m3-t128,  a3HysteresisDb: 3, a3TttMs: 128}
    - {tag: m3-t256,  a3HysteresisDb: 3, a3TttMs: 256}
    - {tag: m3-t512,  a3HysteresisDb: 3, a3TttMs: 512}
    - {tag: m5-t128,  a3HysteresisDb: 5, a3TttMs: 128}
    - {tag: m5-t256,  a3HysteresisDb: 5, a3TttMs: 256}
    - {tag: m5-t512,  a3HysteresisDb: 5, a3TttMs: 512}
