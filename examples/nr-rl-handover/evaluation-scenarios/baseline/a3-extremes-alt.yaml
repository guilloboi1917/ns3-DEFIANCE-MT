# a3-extremes-alt.yaml — A3 matched baselines for the altitude-extreme RL
# evals (rl-eval-extremes-alt): {5-15} m (below-clutter) and {150-200} m
# (high-altitude LOS fan) at the canonical speed 20 m/s. Purpose
# (evaluation B4): test where the B3 result holds outside the canonical
# [50-200] m band — the RL policy is position-invariant per the feature
# analysis, and these cells stress the altitude envelope.
#
# Radio: 30 MHz n1, NO aerial interferers, TCP cap 35 Mbps, RLC AM, 50 s,
# 20 seeds.
#
# Run:
#   python3 .../run-evaluations.py .../evaluation-scenarios/baseline/a3-extremes-alt.yaml \
#       --jobs 4 --analyze

evaluation:
  name: a3-extremes-alt
  mode: a3
  n_seeds: 20
  sim_time: 50
  common:
    flowDirection: ul
    transportProtocol: tcp
    uavMobility: random-waypoint
    ueSpeed: 20
    addInterferingUes: 0
    aerialUeRatio: 0
    topology: triangle
    bandwidthMhz: 30
    numerology: 1
    trafficRateMbps: 35        # TCP cap (offered load)
  scenarios:
    - {tag: h5-15,    startHeight: 5,   endHeight: 15}
    - {tag: h150-200, startHeight: 150, endHeight: 200}
