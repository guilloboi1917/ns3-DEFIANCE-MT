# tcp-vs-udp.yaml — transport demo: TCP vs UDP at the same offered loads,
# A3 baseline. TCP is NOT goodput-neutral on handovers: the congestion
# controller dips (cwnd/RTT) after lossy handovers, so the comparison shows
# the transport penalty on top of the radio event.
#
# Two radio configs, each with a tcp and a udp cell:
#   1. 30 MHz, numerology 1 (30 kHz SCS)  — canonical campaign radio;
#      UDP offered 45 Mbps (measured v5.1 UL ceiling 40.3 Mbps x 1.1 @
#      [50-100] m; canonical-band re-probe in capacity-probe.yaml),
#      TCP cap 35 Mbps (== the RL/A3 eval cap: can TCP sustain its target
#      through handover dips?)
#   2. 50 MHz, numerology 1 (30 kHz)  — n78-realistic; UDP offered
#      70 Mbps (measured ceiling 63.5 Mbps x 1.1), TCP cap 50 Mbps
#      (the TR 36.777 UL data-rate requirement).
# Offered >= ceiling on the UDP cells makes the transport the bottleneck:
# UDP runs near capacity, TCP dips at handover transients. The 50 MHz n1
# cell shows the same effect at the TR requirement rate.
#
# Cell: [50-200] m @ 20 m/s (canonical band, 2026-09-02; was [50-100] m),
# triangle, random-waypoint, NO aerial interferers (best-case radio),
# runId=1, 50 s sim (canonical episode length, comparable with the B3
# tables), eesm-ir-t1, RLC AM for tcp / UM for udp (scenario policy),
# TcpBbr. 20 seeds.
#
# Run:
#   python3 .../run-evaluations.py .../evaluation-scenarios/baseline/tcp-vs-udp.yaml \
#       --jobs 4 --analyze

evaluation:
  name: tcp-vs-udp
  mode: a3
  n_seeds: 20
  sim_time: 50
  common:
    flowDirection: ul
    startHeight: 50
    endHeight: 200
    ueSpeed: 20
    addInterferingUes: 0
    aerialUeRatio: 0
    topology: triangle
    uavMobility: random-waypoint
    tcpVariant: TcpBbr
  scenarios:
    - {tag: bw30-n1_tcp, transportProtocol: tcp, bandwidthMhz: 30, numerology: 1, trafficRateMbps: 35}
    - {tag: bw30-n1_udp, transportProtocol: udp, bandwidthMhz: 30, numerology: 1, trafficRateMbps: 45}
    - {tag: bw50-n1_tcp, transportProtocol: tcp, bandwidthMhz: 50, numerology: 1, trafficRateMbps: 50}
    - {tag: bw50-n1_udp, transportProtocol: udp, bandwidthMhz: 50, numerology: 1, trafficRateMbps: 70}
