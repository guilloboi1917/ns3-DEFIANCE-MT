# mtx-ul.yaml — UDP-only height x speed UL characterization matrix (A3).
#
# Purpose: map the UL radio (goodput, e2e loss, UL SINR, HO rate) across
# altitude bands and speeds under a NEAR-CAPACITY offered load, as baseline
# context for the RL campaign.
#
# Offered load: 35 Mbps at 30 MHz n1 — measured UL ceiling ~33 Mbps
# (capacity probe, results/capacity-probe; to be re-confirmed on v5.1), so
# the offered load is just above the ceiling: UDP runs near capacity and
# the height/speed differences stay visible in goodput AND loss. The
# 100 Mbps RL training is unaffected (the agent sees the same obs/reward at
# any offered load above the ceiling).
#
# Grid: heights {[5-15], [50-100], [100-150], [150-200]} m x speeds
#       {5, 10, 20} m/s, UDP = 12 cells.
# Radio: 30 MHz, numerology 1 (30 kHz SCS) = canonical campaign config,
# triangle, random-waypoint at the fixed band, NO aerial interferers
# (best-case radio), runId=1, 20 s sim, A3, eesm-ir-t1 (scenario default),
# RLC UM (udp policy). 20 seeds.
#
# Run:
#   python3 .../run-evaluations.py .../evaluation-scenarios/baseline/mtx-ul.yaml \
#       --jobs 4 --analyze

evaluation:
  name: mtx-ul
  mode: a3
  n_seeds: 20
  sim_time: 20
  common:
    flowDirection: ul
    bandwidthMhz: 30
    numerology: 1
    trafficRateMbps: 35
    addInterferingUes: 0
    aerialUeRatio: 0
    topology: triangle
    uavMobility: random-waypoint
  scenarios:
    - {tag: h5-15_s5,    ueSpeed: 5,  startHeight: 5,   endHeight: 15}
    - {tag: h5-15_s10,   ueSpeed: 10, startHeight: 5,   endHeight: 15}
    - {tag: h5-15_s20,   ueSpeed: 20, startHeight: 5,   endHeight: 15}
    - {tag: h50-100_s5,  ueSpeed: 5,  startHeight: 50,  endHeight: 100}
    - {tag: h50-100_s10, ueSpeed: 10, startHeight: 50,  endHeight: 100}
    - {tag: h50-100_s20, ueSpeed: 20, startHeight: 50,  endHeight: 100}
    - {tag: h100-150_s5, ueSpeed: 5,  startHeight: 100, endHeight: 150}
    - {tag: h100-150_s10,ueSpeed: 10, startHeight: 100, endHeight: 150}
    - {tag: h100-150_s20,ueSpeed: 20, startHeight: 100, endHeight: 150}
    - {tag: h150-200_s5, ueSpeed: 5,  startHeight: 150, endHeight: 200}
    - {tag: h150-200_s10,ueSpeed: 10, startHeight: 150, endHeight: 200}
    - {tag: h150-200_s20,ueSpeed: 20, startHeight: 150, endHeight: 200}
