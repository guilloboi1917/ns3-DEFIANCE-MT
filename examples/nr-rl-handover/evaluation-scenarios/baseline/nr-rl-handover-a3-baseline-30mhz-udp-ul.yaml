# nr-rl-handover-a3-baseline-30mhz-udp-ul.yaml — A3 baseline (UDP, UL), both
# interference variants. Ground-truth reference of a conventional handover
# policy (A3) for the UL agent evals; same canonical config and pinned RNG
# streams so it is comparable per seed: 30 MHz n1, triangle, ISD 500 m,
# random-waypoint 50-200 m @ 20 m/s, UMa-AV 20 ms, eesm-ir-t1, UDP UL,
# near-capacity 35 Mbps (just above the measured ~33 Mbps ceiling), 50 s.
#
# Run:
#   python3 contrib/defiance/examples/nr-rl-handover/run-evaluations.py \
#       contrib/defiance/examples/nr-rl-handover/evaluation-scenarios/baseline/nr-rl-handover-a3-baseline-30mhz-udp-ul.yaml \
#       --jobs 4 --analyze

evaluation:
  name: "nr-rl-handover-a3-baseline-30mhz-udp-ul"
  mode: a3
  n_seeds: 20
  sim_time: 50

  common:
    topology: triangle
    intersiteDistance: 500
    uavMobility: random-waypoint
    ueSpeed: 20
    startHeight: 50
    endHeight: 200
    bandwidthMhz: 30
    numerology: 1
    errorModel: eesm-ir-t1
    channelUpdateMs: 20
    trafficRateMbps: 35         # near-capacity load (measured 30 MHz n1 UL ceiling ~33 Mbps)
    rlRewardRefMbps: 35       # informational (A3 runs no RL apps); matches the agent evals

  scenarios:
    - tag: "udp-ul-no-if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 0
      aerialUeRatio: 0.0
      transportProtocol: udp

    - tag: "udp-ul-if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 4
      aerialUeRatio: 1.0
      transportProtocol: udp
