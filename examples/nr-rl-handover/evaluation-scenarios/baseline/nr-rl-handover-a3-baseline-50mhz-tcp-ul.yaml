# nr-rl-handover-a3-baseline-50mhz-tcp-ul.yaml — A3 baseline (TCP, UL), no
# interference variant. Same canonical config as the 30 MHz TCP baseline
# but at 50 MHz n1 (ceiling ~49 Mbps): kept for the bandwidth sweep; the
# controlled RL-vs-A3 TCP comparison is at 30 MHz n1 (same cell as the
# agent). 50 MHz n1, triangle, ISD 500 m, random-waypoint 50-200 m @ 20 m/s,
# UMa-AV 20 ms, eesm-ir-t1, TCP UL, 35 Mbps offered, 50 s.
#
# Run:
#   python3 contrib/defiance/examples/nr-rl-handover/run-evaluations.py \
#       contrib/defiance/examples/nr-rl-handover/evaluation-scenarios/baseline/nr-rl-handover-a3-baseline-30mhz-udp-ul.yaml \
#       --jobs 4 --analyze

evaluation:
  name: "nr-rl-handover-a3-baseline-50mhz-tcp-ul"
  mode: a3
  n_seeds: 10
  sim_time: 50

  common:
    topology: triangle
    intersiteDistance: 500
    uavMobility: random-waypoint
    ueSpeed: 20
    startHeight: 50
    endHeight: 200
    bandwidthMhz: 50
    numerology: 1
    errorModel: eesm-ir-t1
    channelUpdateMs: 20
    trafficRateMbps: 35         # near-capacity load (measured 50 MHz n1 UL ceiling ~48.8 Mbps)
    rlRewardRefMbps: 35       # informational (A3 runs no RL apps); matches the agent evals

  scenarios:
    - tag: "tcp-ul-no-if"
      algorithm: a3
      flowDirection: ul
      addInterferingUes: 0
      aerialUeRatio: 0.0
      transportProtocol: tcp

    # - tag: "tcp-ul-if"
    #   algorithm: a3
    #   flowDirection: ul
    #   addInterferingUes: 4
    #   aerialUeRatio: 1.0
    #   transportProtocol: tcp
