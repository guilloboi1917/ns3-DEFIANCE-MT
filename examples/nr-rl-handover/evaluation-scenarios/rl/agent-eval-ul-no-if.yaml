# Trained RL agent evaluation (greedy, one episode per seed from the
# checkpoint's best_checkpoint); results land in
# results/<name>/<tag>/{raw,aggregate}.csv.
#
# Run:
#   python3 contrib/defiance/examples/nr-rl-handover/run-evaluations.py \
#       contrib/defiance/examples/nr-rl-handover/evaluation-scenarios/rl/agent-eval-ul-no-if.yaml \
#       --jobs 4 --analyze
#
# Reward/obs-affecting settings are INHERITED from the checkpoint run's
# meta.yaml when not listed here, so the eval reward matches training while
# the scenarios vary topology/interference. Explicit `common:` values override.

evaluation:
  name: agent-eval-ul-no-if
  mode: rl
  checkpoint: /home/nisaak/ray_results/PPO_<ul-no-if-run>/  # auto-appends best_checkpoint; or pass -a
  n_seeds: 20
  sim_time: 50                 # must match the training simDuration
  common:
    transportProtocol: udp
    flowDirection: ul           # 3GPP UAV primary direction (UL)
    uavMobility: random-waypoint
    startHeight: 50
    endHeight: 200
    topology: triangle
    addInterferingUes: 0
    aerialUeRatio: 0.0
    interfererMobility: static  # "waypoint" = legacy random flight
    bandwidthMhz: 10
    errorModel: eesm-ir-t1
    channelUpdateMs: 20         # channel spatial-consistency update period (ms)
    trafficRateMbps: 15         # near-capacity load (UL ceiling 13.5 Mbps); agent load-agnostic above it
    rlRewardRefMbps: 15         # must match the training config
  scenarios:
    - tag: triangle-ul-no-if
      topology: triangle
      addInterferingUes: 0
      aerialUeRatio: 0.0
