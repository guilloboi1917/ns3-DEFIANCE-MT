# evaluate-agent.py scenario matrix — IN-DOMAIN evaluation of the two-ray
# trained policy (channel-fidelity transfer study, 2026-08-13).
#
# Same matrix as agent-scenarios-udp-dl-if.yaml but with `channelModel:
# tworay` in `common:` — evaluates a checkpoint trained with
# train-ppo-dl-if-tworay.yaml on the SAME (cheap) channel it trained on.
# The cross-domain evaluation (the actual transfer result) runs the same
# checkpoint through agent-scenarios-udp-dl-if.yaml (default channelModel
# umav):
#
#   in-domain  (tworay):  evaluate-agent.py .../agent-scenarios-udp-dl-if-tworay.yaml -a <tworay-run>
#   cross-domain (umav):  evaluate-agent.py .../agent-scenarios-udp-dl-if.yaml        -a <tworay-run>
#
# Both evals use the same ref (6), reward and obs as training; the ONLY
# difference between the two eval runs is the channel model, so the metric
# gap between them quantifies the channel-fidelity transfer loss.
#
# Usage:
#   cd /path/to/ns-3-dev
#   python3 contrib/defiance/examples/nr-rl-handover/evaluate-agent.py \
#       contrib/defiance/examples/nr-rl-handover/evaluation-scenarios/agent-scenarios-udp-dl-if-tworay.yaml \
#       -a ~/ray_results/<tworay-exp>/ -j 4

evaluation:
  name: agent-eval-ppo-tworay
  # Experiment dir (auto-appends best_checkpoint) or direct checkpoint dir.
  # Point this at the train-ppo-dl-if-tworay.yaml run (or override with -a).
  checkpoint: /home/nisaak/ray_results/PPO_2026-08-24_18-14-40/
  n_seeds: 7
  sim_time: 50                 # matched to scenarios-a3-baseline-10mhz.yaml (2026-08-13)
  common:
    transportProtocol: udp
    flowDirection: dl
    uavMobility: random-waypoint
    startHeight: 50
    endHeight: 200
    bandwidthMhz: 10           # canonical campaign config (2026-08-13)
    errorModel: eesm-ir-t1     # canonical campaign config (2026-08-13)
    channelUpdateMs: 50        # canonical campaign config (2026-08-13)
    channelModel: tworay       # <-- in-domain eval channel
    rlRewardRefMbps: 10        # must match train-ppo-dl-if-tworay.yaml (was 6, mismatch fixed 2026-08-26)
  scenarios:
    - tag: triangle-dl-if
      topology: triangle
      addInterferingUes: 4
      aerialUeRatio: 1.0
