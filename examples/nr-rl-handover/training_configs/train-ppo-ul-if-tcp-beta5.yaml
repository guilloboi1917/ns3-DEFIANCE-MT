# beta-5.0 IN-REGIME variant of train-ppo-ul-if-tcp.yaml (created 2026-09-19).
# Trained under the new scenario default beamformingMethod=quasiomni, i.e. uniformly
# unsteered for the whole episode - unlike every earlier checkpoint, which was trained
# under the old default (directpath: gNB steered until the agent's first handover).
# Purpose: does native in-regime training (4 aerial interferers) with the 5x handover
# penalty close the gap to A3 that the uniformly unsteered rerun revealed?
# TCP-training variant of train-ppo-ul-if
type: train
env_name: defiance-nr-rl-handover
trainable: PPO
iterations: 100
max_episode_steps: 100    # informational for multi-agent
checkpoint_path: null
rollout_fragment_length: null
sample_timeout: 1200.0
evaluation_num_env_runners: 0
evaluation_interval: 2
evaluation_duration: "1"
evaluation_sample_timeout: 600.0

# RL algorithm hyperparameter overrides (-p key=value pairs).
training_params:
  minibatch_size: 128
  entropy_coeff: [[0, 0.025], [40000, 0.01]]
  kl_target: 0.01
  lr: [[0, 0.0005], [40000, 0.00005]]
  vf_loss_coeff: 1.0       # unrestrained value
  vf_clip_param: 10.0      # loose clip (return scale ~165)
  lambda_: 0.9             # less stale-value bootstrap
  gamma: 0.9               # ~10-step (4 s) effective horizon

# ns-3 run parameters (-c key=value pairs).
ns3_settings:
  parallel: "7"
  simDuration: "50"
  topology: triangle
  rlMode: "true"
  handoverAlgorithm: agent
  transportProtocol: tcp
  flowDirection: ul
  addInterferingUes: "4"
  aerialUeRatio: "1.0"
  interfererMobility: "static"
  stepTime: "400"          # 400 ms step: doubles the discount horizon per step
  obsStackFrames: "2"      # stack 2 obs frames -> 64 dims
  rlAlphaGoodput: "0.8"    # No effect when using multiplicative reward composition
  rlBetaGoodput: "5"       # No effect when using multiplicative reward composition
  rlBetaHandover: "5.0"
  rlRewardComposition: multiplicative
  rlPingPongMultiplier: "5"
  rlPingPongWindowMs: "5000"     # A->B->A counts as ping-pong only within 5 s (fix 2026-09-20)
  rlHandoverHangoverLength: "1"
  rlRewardRefMbps: "35"    # keeps normG in the steep compl_pwr region
  rlRewardGoodputShape: "compl_pwr"
  rlRewardGoodputP: "0.4"
  bandwidthMhz: "30"
  numerology: "1"
  trafficRateMbps: "100"   # well above the ~33 Mbps ceiling: load-agnostic
  errorModel: "eesm-ir-t1"
  channelUpdateMs: "20"    
  logging: "false"
