# =====================================================================
# NEW RECIPE (2026-09-20) - not a modification of any existing config.
# =====================================================================
# Final clean-regime training arm for the thesis. Same scenario and PPO
# hyperparameters as train-ppo-ul-no-if-tcp-beta5.yaml (beta_H 5.0, no
# interferers, 100 iterations), with two documented differences:
#
#   1. rlHandoverHangoverLength 1 -> 2. The reward taxes the steps after a
#      handover with a decaying weight w = exp(-age/N); N=2 doubles the window
#      (0.8 s at a 400 ms decision step). Rationale: the serving-cell interface
#      defect silently blocked a handover request at exactly +400 ms after every
#      handover, so it acted as an accidental minimum-time-of-stay. With that
#      defect fixed (see below), the explicit post-handover tax is what supplies
#      the damping. Measured on the pre-fix policy: 20-seed paired comparison
#      without the defect gives +5.90 handovers (p=0.003) and +4.10 ping-pong
#      patterns (p=0.005).
#   2. rlPingPongWindowMs 5000 (new key). An A->B->A pattern only counts as a
#      ping-pong when the two handovers back to the same cell are at most 5 s
#      apart; previously any A->B->A was flagged regardless of elapsed time and
#      charged beta_H x5. On the pre-fix policy, 70% of flagged reward steps on a
#      tested seed were patterns older than 5 s.
#
# Code state used by this run (contrib/defiance, 2026-09-20):
#   - nr-rl-handover-obs-app.cc: ComputeTopNCells re-syncs the serving cell with
#     the live RRC state before ranking, so the freshly served cell can no longer
#     remain a candidate and be requested (was 15-32% of requests, 0.8-7.7% of
#     decision steps).
#   - nr-rl-handover-rwd-app.cc: PingPongWindowMs attribute (default 0 = legacy).
#   - Beam regime: uniformly unsteered (scenario default is quasiomni since
#     2026-09-18). The earlier checkpoints were trained under the previous
#     directpath default, i.e. with gNB steering during the opening window, and
#     are kept only as the pre-fix record - they are NOT comparable to this arm.
#
# Evaluation must inherit rlHandoverHangoverLength and rlPingPongWindowMs from
# this run's meta.yaml; both are in REWARD_ENV_KEYS in run-evaluations.py.
# =====================================================================
type: train
env_name: defiance-nr-rl-handover
trainable: PPO
iterations: 100
max_episode_steps: 100    # informational for multi-agent
checkpoint_path: null
rollout_fragment_length: null
sample_timeout: 1200.0
evaluation_num_env_runners: 0
evaluation_interval: 2
evaluation_duration: "1"
evaluation_sample_timeout: 600.0

# RL algorithm hyperparameter overrides (-p key=value pairs).
training_params:
  minibatch_size: 128
  entropy_coeff: [[0, 0.025], [40000, 0.01]]
  kl_target: 0.01
  lr: [[0, 0.0005], [40000, 0.00005]]
  vf_loss_coeff: 1.0       # unrestrained value
  vf_clip_param: 10.0      # loose clip (return scale ~165)
  lambda_: 0.9             # less stale-value bootstrap
  gamma: 0.9               # ~10-step (4 s) effective horizon

# ns-3 run parameters (-c key=value pairs).
ns3_settings:
  parallel: "7"
  simDuration: "50"
  topology: triangle
  rlMode: "true"
  handoverAlgorithm: agent
  transportProtocol: tcp
  flowDirection: ul
  addInterferingUes: "0"
  aerialUeRatio: "1.0"
  interfererMobility: "static"
  stepTime: "400"          # 400 ms step: doubles the discount horizon per step
  obsStackFrames: "2"      # stack 2 obs frames -> 64 dims
  rlAlphaGoodput: "0.8"
  rlBetaGoodput: "5"
  rlBetaHandover: "5.0"
  rlRewardComposition: multiplicative
  rlPingPongMultiplier: "5"
  rlPingPongWindowMs: "5000"      # NEW: A->B->A counts as ping-pong only within 5 s
  rlHandoverHangoverLength: "2"   # NEW: 0.8 s post-handover tax window (was 1 step)
  rlRewardRefMbps: "35"    # keeps normG in the steep compl_pwr region
  rlRewardGoodputShape: "compl_pwr"
  rlRewardGoodputP: "0.4"
  bandwidthMhz: "30"
  numerology: "1"
  trafficRateMbps: "100"   # well above the ~33 Mbps ceiling: load-agnostic
  errorModel: "eesm-ir-t1"
  channelUpdateMs: "20"
  logging: "false"
